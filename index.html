<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oficina Virtual Interactiva</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0b1220}
body{color:#fff;font-family:'Segoe UI',Tahoma,Verdana,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100%;padding:12px;user-select:none;padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
header{width:1313px;max-width:100%;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:#1e293b;padding:10px 18px;border-radius:10px;border:1px solid #334155}
h1{font-size:15px;color:#f8fafc}
.hint{font-size:12px;color:#94a3b8}.hint span{color:#fbbf24;font-weight:bold}
.container{position:relative;width:1313px;max-width:100%;border:2px solid #334155;border-radius:12px;overflow:hidden;box-shadow:0 12px 36px rgba(0,0,0,.55)}
canvas{display:block;width:100%;height:auto;cursor:pointer;background:#444}
.prompt{display:none;position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.95);color:#fbbf24;border:1px solid #fbbf24;padding:8px 18px;border-radius:8px;font-size:13px;font-weight:bold;white-space:nowrap}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;align-items:center;justify-content:center;padding:16px}
.modal-box{background:#1e293b;border:1px solid #334155;width:380px;max-width:100%;border-radius:12px;padding:22px;position:relative}
.close-btn{position:absolute;top:10px;right:10px;background:#334155;color:#fff;border:none;width:26px;height:26px;border-radius:50%;cursor:pointer;font-weight:bold}
.modal-title{font-size:17px;font-weight:bold;color:#fbbf24;margin-bottom:4px;padding-right:30px}
.modal-sub{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px}
.modal-desc{font-size:13px;color:#cbd5e1;background:#0f172a;padding:12px;border-radius:8px;margin-bottom:16px;line-height:1.45}
.modal-btn{width:100%;background:#f59e0b;color:#000;font-weight:bold;padding:10px;border:none;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>🏢 Oficina Virtual - Mapa Interactivo</h1>
  <div class="hint">Controles: <span>W A S D</span> / <span>Flechas</span> / <span>Clic</span> · <span>E</span> para interactuar</div>
</header>
<div class="container">
  <canvas id="c" width="1313" height="732"></canvas>
  <div id="prompt" class="prompt"></div>
</div>
<div id="modal" class="modal">
  <div class="modal-box">
    <button id="closeBtn" class="close-btn">✕</button>
    <div id="mt" class="modal-title"></div>
    <div id="ms" class="modal-sub"></div>
    <div id="md" class="modal-desc"></div>
    <button id="actionBtn" class="modal-btn">Aceptar</button>
  </div>
</div>
<script>
const W=1313,H=732;
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const promptEl=document.getElementById('prompt'),modalEl=document.getElementById('modal');
const BLUE='#2a587c',GRAY='#6b8688',ORANGE='#f6b04f',GREEN='#b0c52b',DGREEN='#3f8a45',BROWN='#4a3208';

const areas=[
 {name:'Cafetería',sub:'Área de Descanso',x:80,y:447,w:113,h:148,desc:'Espacio de coffee break para recargar energías.'},
 {name:'AUDITORÍA INTERNA',sub:'Módulo Operativo',x:193,y:447,w:194,h:146,desc:'Control de procesos e informes de auditoría.'},
 {name:'GESTIÓN DE INVENTARIOS',sub:'Área de Trabajo',x:387,y:447,w:506,h:144,desc:'Monitoreo, control de stock y logística interna.'},
 {name:'Soporte Operativo',sub:'Puestos de trabajo',x:893,y:447,w:129,h:106,desc:'Puestos de apoyo operativo y administrativo.'},
 {name:'IT',sub:'Tecnología',x:200,y:155,w:64,h:235,desc:'Soporte técnico e infraestructura.'},
 {name:'SAP',sub:'Gestión ERP',x:264,y:155,w:189,h:235,desc:'Administración del sistema SAP.'},
 {name:'A.C. Y SOCIETARIOS',sub:'Legal',x:453,y:155,w:61,h:235,desc:'Gestión corporativa y asuntos legales.'},
 {name:'IT',sub:'Servidores y Redes',x:514,y:10,w:256,h:380,desc:'Redes y seguridad de la información.'},
 {name:'BI',sub:'Analítica',x:772,y:10,w:61,h:380,desc:'Análisis de datos e indicadores estratégicos.'},
 {name:'COMPRAS',sub:'Aprovisionamiento',x:835,y:10,w:127,h:380,desc:'Gestión de proveedores y compras.'},
 {name:'PROCESOS Y COMPLIANCE',sub:'Cumplimiento',x:962,y:10,w:64,h:380,desc:'Cumplimiento normativo y estandarización.'},
 {name:'TAC',sub:'Zona Exterior',x:1026,y:10,w:287,h:380,desc:'Zona verde exterior y reuniones TAC.'},
 {name:'SALA C.3',sub:'Reuniones',x:1058,y:447,w:39,h:106,desc:'Sala de reuniones C.3.'},
 {name:'SALA C.2',sub:'Reuniones',x:1097,y:447,w:39,h:106,desc:'Sala de reuniones C.2.'},
 {name:'LOBBY',sub:'Recepción',x:1136,y:447,w:72,h:106,desc:'Recepción principal y control de acceso.'},
 {name:'SALA C.1',sub:'Reuniones',x:893,y:587,w:125,h:44,desc:'Sala de juntas equipada.'},
 {name:'TALENTO HUMANO',sub:'Recursos Humanos',x:893,y:553,w:240,h:179,desc:'Gestión del personal y gestión humana.'}
];

/* ---------- Capa estática (se dibuja una sola vez) ---------- */
const bg=document.createElement('canvas');bg.width=W;bg.height=H;
const b=bg.getContext('2d');

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
let _seed=7;function rnd(){_seed=(_seed*16807)%2147483647;return _seed/2147483647;}
function zone(x,y,w,h,col,light=.07){
  b.fillStyle=col;b.fillRect(x,y,w,h);
  for(let i=0;i<w*h/14;i++){b.fillStyle=rnd()>.5?'rgba(255,255,255,.05)':'rgba(0,0,0,.06)';b.fillRect(x+rnd()*w,y+rnd()*h,1.2,1.2);}
  const sh=b.createLinearGradient(x,y,x,y+h);
  sh.addColorStop(0,'rgba(255,255,255,.05)');sh.addColorStop(1,'rgba(0,0,0,.14)');
  b.fillStyle=sh;b.fillRect(x,y,w,h);
}
function divider(x,y1,y2){b.fillStyle='rgba(0,0,0,.75)';b.fillRect(x,y1,2,y2-y1);}
function desk(x,y,w=14,h=54){
  b.fillStyle='rgba(0,0,0,.30)';rr(b,x+3,y+4,w,h,2);b.fill();
  const g=b.createLinearGradient(x,y,x+w,y);
  g.addColorStop(0,'#fbfbff');g.addColorStop(1,'#dedcee');
  b.fillStyle=g;rr(b,x,y,w,h,2);b.fill();
  b.strokeStyle='rgba(130,130,170,.55)';b.lineWidth=1;rr(b,x+.5,y+.5,w-1,h-1,2);b.stroke();
  b.fillStyle='rgba(255,255,255,.75)';b.fillRect(x+1,y+1,w-2,1.5);
}
function workstation(x,y){
  b.save();b.translate(x,y);
  const L=()=>{b.beginPath();b.moveTo(0,0);b.lineTo(36,0);b.lineTo(36,11);b.lineTo(12,11);b.lineTo(12,30);b.lineTo(0,30);b.closePath();};
  // sombra proyectada
  b.save();b.translate(3,4);b.fillStyle='rgba(0,0,0,.32)';L();b.fill();b.restore();
  // tablero laminado
  const g=b.createLinearGradient(0,0,36,30);g.addColorStop(0,'#fdfdff');g.addColorStop(1,'#dcdbea');
  b.fillStyle=g;L();b.fill();
  b.strokeStyle='rgba(120,120,160,.6)';b.lineWidth=1;L();b.stroke();
  b.fillStyle='rgba(255,255,255,.8)';b.fillRect(1,1,34,1.5);
  // monitor (vista cenital, delgado)
  b.fillStyle='#2a2f3a';rr(b,16,2.5,16,5,1);b.fill();
  const sg=b.createLinearGradient(0,0,0,1);b.fillStyle='#6fb6e0';b.fillRect(17.5,3.5,13,2.2);
  b.fillStyle='rgba(255,255,255,.5)';b.fillRect(18,3.7,5,.8);
  // teclado y mouse
  b.fillStyle='#c3c7d6';rr(b,3,14,7,12,1);b.fill();
  b.strokeStyle='rgba(90,95,120,.5)';b.stroke();
  b.fillStyle='#b4b9ca';rr(b,28,7.5,3,2.2,1);b.fill();
  b.restore();
}
function plant(x,y){
  b.fillStyle='rgba(0,0,0,.32)';rr(b,x+2,y+3,34,24,3);b.fill();
  const g=b.createLinearGradient(x,y,x,y+24);g.addColorStop(0,'#c9673f');g.addColorStop(1,'#9a4226');
  b.fillStyle=g;rr(b,x,y,34,24,3);b.fill();
  b.strokeStyle='rgba(60,25,10,.5)';b.lineWidth=1;b.stroke();
  b.fillStyle='#3b2a1c';rr(b,x+3,y+3,28,18,2);b.fill();
  const cols=['#15803d','#16a34a','#22a652','#0f6b32'];
  for(let i=0;i<14;i++){const a=i*0.45;const r=3+(i%3)*2.2;
    b.fillStyle=cols[i%4];b.beginPath();b.ellipse(x+17+Math.cos(a)*r,y+12+Math.sin(a)*r*0.9,5.5,2.3,a,0,7);b.fill();}
  b.fillStyle='rgba(180,255,200,.35)';b.beginPath();b.arc(x+15,y+10,3,0,7);b.fill();
}
function roundTable(x,y,r=11){
  b.fillStyle='rgba(0,0,0,.35)';b.beginPath();b.arc(x+2,y+3,r,0,7);b.fill();
  b.fillStyle='#f8fafc';b.beginPath();b.arc(x,y,r,0,7);b.fill();
  b.strokeStyle='#cbd5e1';b.stroke();
  b.fillStyle='#1e293b';
  [[-r-4,0],[r+4,0],[0,-r-4],[0,r+4]].forEach(([dx,dy])=>{b.beginPath();b.arc(x+dx,y+dy,3.5,0,7);b.fill();});
}
function text(t,x,y,size,rot=true,col='#fff'){
  b.save();b.translate(x,y);if(rot)b.rotate(-Math.PI/2);
  b.font='bold '+size+'px "Segoe UI",Arial,sans-serif';b.textAlign='center';b.textBaseline='middle';
  b.shadowColor='rgba(0,0,0,.55)';b.shadowBlur=3;b.shadowOffsetY=1;
  b.fillStyle=col;b.fillText(t,0,0);b.restore();
}

function buildBackground(){
  // Fondo exterior
  b.fillStyle='#454545';b.fillRect(0,0,W,H);
  const vg=b.createRadialGradient(W/2,H/2,200,W/2,H/2,800);
  vg.addColorStop(0,'rgba(255,255,255,.04)');vg.addColorStop(1,'rgba(0,0,0,.25)');
  b.fillStyle=vg;b.fillRect(0,0,W,H);
  // curva inferior derecha
  b.fillStyle='#3d3d3d';b.beginPath();b.arc(1313,732,185,Math.PI,Math.PI*1.5);b.lineTo(1313,732);b.fill();

  // Zona exterior TAC
  const tg=b.createLinearGradient(1026,0,1313,0);tg.addColorStop(0,'#aec62a');tg.addColorStop(1,'#b8cc34');
  b.fillStyle=tg;b.fillRect(1026,10,287,380);b.fillRect(1208,390,105,163);

  // Pasillo naranja
  const og=b.createLinearGradient(0,390,0,447);og.addColorStop(0,'#f8b95e');og.addColorStop(1,'#f2a845');
  b.fillStyle=og;b.fillRect(137,390,1071,57);b.fillRect(137,155,63,235);b.fillRect(1022,447,186,106);
  // textura de piso
  b.fillStyle='rgba(110,55,0,.16)';
  for(let x=137;x<1208;x+=40)b.fillRect(x,390,1,57);
  b.fillRect(137,418,1071,1);
  for(let y=155;y<390;y+=40)b.fillRect(137,y,63,1);
  for(let x=1022;x<1208;x+=40)b.fillRect(x,447,1,106);
  b.fillStyle='rgba(255,255,255,.10)';b.fillRect(137,392,1071,3);
  for(let i=0;i<2200;i++){b.fillStyle=rnd()>.5?'rgba(255,255,255,.05)':'rgba(120,60,0,.06)';b.fillRect(137+rnd()*1071,390+rnd()*57,1.2,1.2);}

  // Zonas
  zone(80,447,113,148,BROWN,.03);
  zone(193,447,194,146,BLUE);
  zone(387,447,254,144,GRAY);zone(641,447,252,144,GRAY);
  zone(893,447,129,106,BLUE);
  zone(200,155,64,235,GRAY);
  zone(264,155,189,235,BLUE);
  zone(453,155,61,235,GRAY);
  zone(514,155,124,235,BLUE);zone(638,10,132,380,BLUE);
  zone(772,10,61,380,GRAY);
  zone(835,10,127,380,BLUE);
  zone(962,10,64,380,GRAY);
  zone(893,553,240,179,DGREEN,.05);zone(1022,553,111,179,DGREEN,.05);

  // sombra proyectada de los módulos sobre el piso
  b.save();b.globalCompositeOperation='multiply';
  [[200,155,64,235],[264,155,189,235],[514,155,256,235],[638,10,132,380],[835,10,127,380],[193,447,194,146],[387,447,254,144],[641,447,252,144]].forEach(r=>{const sg=b.createLinearGradient(0,r[1],0,r[1]+10);sg.addColorStop(0,'rgba(0,0,0,.28)');sg.addColorStop(1,'rgba(0,0,0,0)');b.fillStyle=sg;b.fillRect(r[0],r[1],r[2],10);});
  b.restore();
  // Bordes de sombra entre módulos
  b.strokeStyle='rgba(0,0,0,.35)';b.lineWidth=1;
  [[200,155,64,235],[264,155,189,235],[453,155,61,235],[514,155,256,235],[638,10,132,380],[772,10,61,380],[835,10,127,380],[962,10,64,380],[193,447,194,146],[387,447,254,144],[641,447,252,144],[893,447,129,106]].forEach(r=>b.strokeRect(r[0]+.5,r[1]+.5,r[2],r[3]));

  // Divisores de clústers
  [[388,200,380],[455+0,200,380],[388,150,0]].length;
  divider(262,172,385);divider(388,172,385);divider(512,172,385);
  divider(646,30,385);divider(896,70,380);divider(320,470,585);divider(956,470,550);
  [[451,470,585],[597,470,585],[705,470,585],[851,470,585]].forEach(d=>divider(...d));

  // Escritorios por módulo
  [192,250,308].forEach(y=>{[236,285,355,410,486,526,620].forEach(x=>desk(x,y,13,54));});
  [77,134,192,250,308].forEach(y=>{[657,741].forEach(x=>desk(x,y,14,54));});
  [79,137,195,253,311].forEach(y=>desk(789,y,14,54));
  [81,139,197,255,313].forEach(y=>{desk(862,y,13,54);desk(920,y,13,54);});
  [84,142,200,258,316].forEach(y=>desk(1004,y,14,54));
  [467,523].forEach(y=>desk(201,y,14,56));
  [472,528].forEach(y=>{desk(293,y,14,56);desk(340,y,14,56);});
  [474,530].forEach(y=>{[421,469,548,594,675,722,801,848].forEach(x=>desk(x,y,14,56));});
  // Puestos superiores y laterales
  [650,725,788,875,968].forEach(x=>workstation(x,16));
  workstation(902,455);workstation(968,455);

  // Plantas
  [270,306,342,398,434,470,656,692,728,782,818,854].forEach(x=>plant(x,432));

  // Cafetería: taza
  b.fillStyle='#1c1405';
  b.beginPath();b.moveTo(108,510);b.lineTo(158,510);b.lineTo(155,535);b.quadraticCurveTo(152,543,140,543);b.lineTo(126,543);b.quadraticCurveTo(113,543,111,535);b.closePath();b.fill();
  b.lineWidth=7;b.strokeStyle='#1c1405';b.beginPath();b.arc(158,522,10,-1.4,1.4);b.stroke();
  b.fillStyle='#1c1405';b.fillRect(104,543,60,5);
  b.strokeStyle='rgba(255,255,255,.22)';b.lineWidth=2;
  [118,133,148].forEach((x,i)=>{b.beginPath();b.moveTo(x,500);b.bezierCurveTo(x-5,494,x+5,490,x,484);b.stroke();});

  // Salas C.2 / C.3 (naranja oscuro)
  [[1058,'SALA C.',3],[1098,'SALA C.',2]].forEach(([x,t,n])=>{
    b.fillStyle='#f6a21a';b.fillRect(x,447,38,106);
    b.strokeStyle='#4a3208';b.lineWidth=2;b.strokeRect(x+1,448,36,104);
    roundTable(x+19,525,10);
    text(t,x+19,478,9,false);text(String(n),x+19,490,9,false);
  });
  // Lobby: mostrador y ascensor
  b.fillStyle='#111';rr(b,1142,455,18,34,2);b.fill();b.fillStyle='#e5e7eb';b.fillRect(1161,466,12,24);
  b.fillStyle='#c9a46a';b.fillRect(1160,520,26,34);b.strokeStyle='#4a3208';b.strokeRect(1160.5,520.5,25,33);
  b.fillStyle='rgba(0,0,0,.4)';b.fillRect(1172,521,1,32);
  // Escalera hacia TAC
  b.strokeStyle='rgba(255,255,255,.55)';b.lineWidth=1;
  for(let i=0;i<8;i++){b.beginPath();b.moveTo(1134+i*3,386-i*3.5);b.lineTo(1174-i*0,392-i*3.5);b.stroke();}
  b.strokeRect(1131,352,45,38);
  // Escalera Talento Humano
  b.strokeStyle='rgba(255,255,255,.7)';
  for(let i=0;i<7;i++){b.beginPath();b.moveTo(1073+i*5,566+i*3);b.lineTo(1115,570+i*4);b.stroke();}

  // Sala C.1 y puestos de Talento Humano
  b.strokeStyle='#e5e7eb';b.lineWidth=3;b.strokeRect(895,589,120,41);b.strokeRect(895,635,120,42);
  b.fillStyle='#3f8a45';b.fillRect(897,591,116,37);b.fillRect(897,637,116,38);
  roundTable(925,609,11);
  workstation(902,641);
  // Escritorios horizontales RR.HH.
  const hd=(x,y,w=28)=>{b.fillStyle='rgba(0,0,0,.3)';b.fillRect(x+2,y+3,w,7);b.fillStyle='#f3f4f8';b.fillRect(x,y,w,7);};
  [[1062,630],[1096,630],[1062,652],[1096,652],[1062,698],[1096,698],[1062,714],[1096,714]].forEach(p=>hd(p[0],p[1],30));
  [[908,690,50],[953,690,50]].forEach(p=>hd(p[0],p[1],p[2]));
  b.fillStyle='#111';b.fillRect(908,708,98,3);
  hd(908,716,45);hd(956,716,45);

  // iluminación ambiental suave
  const lg=b.createRadialGradient(660,330,60,660,330,720);
  lg.addColorStop(0,'rgba(255,248,225,.10)');lg.addColorStop(1,'rgba(0,0,20,.22)');
  b.fillStyle=lg;b.fillRect(80,10,1233,722);
  // Rótulos
  text('IT',213,285,17);text('SAP',329,280,17);
  text('A.C. Y SOCIETARIOS',470,280,16);text('IT',575,285,17);
  text('BI',819,220,17);text('COMPRAS',896,200,19);
  text('PROCESOS Y COMPLIANCE',982,230,16);
  text('TAC',1190,235,64);
  text('LOBBY',1198,500,13);
  text('AUDITORÍA',248,525,17);text('INTERNA',272,525,17);
  text('GESTIÓN DE INVENTARIOS',610,465,17,false);
  text('TALENTO',1033,660,16);text('HUMANO',1050,660,16);
  text('SALA C. 1',982,609,10,false);
}
buildBackground();

/* ---------- Jugador ---------- */
const player={x:600,y:418,speed:4,name:'Us',tx:null,ty:null,t:0,moving:false};
const keys={};let activeArea=null;

addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(k==='e')checkTrigger();if(k.startsWith('arrow'))e.preventDefault();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

function drawPlayer(){
  const {x,y,name}=player;
  const sw=player.moving?Math.sin(player.t*.35)*2.5:0;
  ctx.fillStyle='rgba(0,0,0,.38)';ctx.beginPath();ctx.ellipse(x,y+13,11,4.5,0,0,7);ctx.fill();
  // piernas (pantalón) y zapatos
  ctx.fillStyle='#27303f';rr(ctx,x-5,y+5,4.5,9+sw,2);ctx.fill();rr(ctx,x+.5,y+5,4.5,9-sw,2);ctx.fill();
  ctx.fillStyle='#e5e7eb';ctx.fillRect(x-5.5,y+13+sw,5.5,2);ctx.fillRect(x,y+13-sw,5.5,2);
  // brazos
  ctx.fillStyle='#d9631f';rr(ctx,x-10,y-5,4,11,2);ctx.fill();rr(ctx,x+6,y-5,4,11,2);ctx.fill();
  ctx.fillStyle='#f0c3a0';ctx.fillRect(x-10,y+5,4,3);ctx.fillRect(x+6,y+5,4,3);
  // torso
  const g=ctx.createLinearGradient(x-7,y,x+7,y);g.addColorStop(0,'#f4731f');g.addColorStop(.5,'#ea580c');g.addColorStop(1,'#b8470a');
  ctx.fillStyle=g;rr(ctx,x-7,y-7,14,15,4);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillRect(x-2,y-7,4,3);
  // cuello y cabeza
  ctx.fillStyle='#e9b48f';ctx.fillRect(x-2,y-10,4,4);
  const hg=ctx.createRadialGradient(x-2,y-16,1,x,y-14,8);hg.addColorStop(0,'#f8d5b6');hg.addColorStop(1,'#d9a07a');
  ctx.fillStyle=hg;ctx.beginPath();ctx.ellipse(x,y-14,6,7,0,0,7);ctx.fill();
  ctx.fillStyle='#3a2415';ctx.beginPath();ctx.ellipse(x,y-17,6.3,4.5,0,Math.PI,0);ctx.fill();
  ctx.fillStyle='#2b1b10';ctx.fillRect(x-3,y-14,1.4,1.4);ctx.fillRect(x+1.6,y-14,1.4,1.4);
  // etiqueta
  ctx.fillStyle='rgba(15,23,42,.92)';rr(ctx,x-18,y-42,36,15,5);ctx.fill();
  ctx.strokeStyle='#f6b04f';ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle='#22c55e';ctx.beginPath();ctx.arc(x-11,y-34.5,2.5,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 10px "Segoe UI",Arial,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(name,x+4,y-34);
}

function update(){
  let dx=0,dy=0;
  if(keys['arrowup']||keys['w'])dy-=1;
  if(keys['arrowdown']||keys['s'])dy+=1;
  if(keys['arrowleft']||keys['a'])dx-=1;
  if(keys['arrowright']||keys['d'])dx+=1;
  if(dx||dy){player.tx=null;const l=Math.hypot(dx,dy);player.x+=dx/l*player.speed;player.y+=dy/l*player.speed;player.moving=true;}
  else if(player.tx!==null){
    const vx=player.tx-player.x,vy=player.ty-player.y,d=Math.hypot(vx,vy);
    if(d<=player.speed){player.x=player.tx;player.y=player.ty;player.tx=null;player.moving=false;}
    else{player.x+=vx/d*player.speed;player.y+=vy/d*player.speed;player.moving=true;}
  } else player.moving=false;
  player.t++;
  player.x=Math.max(15,Math.min(W-15,player.x));player.y=Math.max(45,Math.min(H-15,player.y));
  // área activa: la más pequeña que contiene al jugador
  const cands=areas.filter(a=>player.x>=a.x&&player.x<=a.x+a.w&&player.y>=a.y&&player.y<=a.y+a.h);
  activeArea=cands.sort((p,q)=>p.w*p.h-q.w*q.h)[0]||null;
  if(activeArea){promptEl.textContent='Presiona E o haz clic para ver '+activeArea.name;promptEl.style.display='block';}
  else promptEl.style.display='none';
}
function checkTrigger(){
  if(!activeArea)return;
  document.getElementById('mt').textContent=activeArea.name;
  document.getElementById('ms').textContent=activeArea.sub;
  document.getElementById('md').textContent=activeArea.desc;
  modalEl.style.display='flex';
}
canvas.addEventListener('click',e=>{
  const r=canvas.getBoundingClientRect();
  const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  // clic sobre el área donde ya estás -> abre información
  if(activeArea&&x>=activeArea.x&&x<=activeArea.x+activeArea.w&&y>=activeArea.y&&y<=activeArea.y+activeArea.h&&Math.hypot(x-player.x,y-player.y)<60){checkTrigger();return;}
  player.tx=x;player.ty=y;
});
document.getElementById('closeBtn').onclick=()=>modalEl.style.display='none';
document.getElementById('actionBtn').onclick=()=>modalEl.style.display='none';

function loop(){update();ctx.drawImage(bg,0,0);drawPlayer();requestAnimationFrame(loop);}
loop();
</script>
